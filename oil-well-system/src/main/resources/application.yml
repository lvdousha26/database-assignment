# application.yml
# 采油厂油水井作业成本管理系统
server:
  port: ${PORT:8080}
  tomcat:
    uri-encoding: UTF-8
    relaxed-query-chars: '|,{,},[,]'

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/tb_oil_well_cost?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    # 开发环境用 root，生产环境建议使用 app_secure（需先执行 schema-security.sql）
    # app_secure 用户: password=secure123456, 仅拥有必要表的最小权限
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      initialization-fail-timeout: -1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/,file:./uploads/
      add-mappings: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

mybatis:
  configuration:
    map-underscore-to-camel-case: true

authority:
  request:
    message: "用户 %USER%(ID:%ID%) 请求获取管理员权限"
  response:
    accept: "管理员 %USER%(ID:%ID%) 已接受您的权限申请"

deepseek:
  api:
    url: ${DEEPSEEK_API_URL:https://api.deepseek.com}
    key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-chat}